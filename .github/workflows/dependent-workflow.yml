name: First Workflow
on: 
  workflow_dispatch:
      

jobs:
  first-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: First steps
        run: |
          echo "Hello first workflow!"
          echo "Hello World!"
  second-workflow:
    runs-on: ubuntu-latest
    needs: [first-workflow]
    steps:
      - name: Second Workflow steps
        run: |
          echo "Hello second workflow!"
          echo "Hello World!"
  third-workflow:
    runs-on: ubuntu-latest
    needs: [first-workflow, second-workflow]
    steps:
      - name: Third Workflow steps
        run: |
          echo "Hello third workflow!"
          echo "Hello World!"

